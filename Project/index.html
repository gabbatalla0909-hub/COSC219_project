<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./js/app.js" defer></script>
    <link rel="stylesheet" href="./css/styles.css">
    <title>Home</title>
</head>
<body>
    <header>
        <h1>
            Minecraft Material Finder
        </h1>
    </header>
    <main>
        <form id="c-form" class="conditions-form">
            <fieldset>
                <legend>Enter the conditions of the biome you are building in...</legend>
                <label for="dim">Dimension</label>
                <select id="dim" name="dimension" required>
                    <option value="overworld">Overworld</option>
                    <option value="nether">Nether</option>
                    <option value="end">The End</option>
                </select>
                <label for="cat">Category</label>
                <select id="cat" name="category">
                    <option value="temperate">Temperate</option>
                    <option value="cold">Cold</option>
                    <option value="warm">Warm</option>
                    <option value="ocean">Ocean</option>
                    <option value="underground">Underground</option>
                    <option value="beach_special">Beach & Special</option>
                </select>
                <label for="rar">Rarity</label>
                <select id="rar" name="rarity">
                    <option value="common">Common</option>
                    <option value="uncommon">Uncommon</option>
                    <option value="rare">Rare</option>
                    <option value="very-rare">Very Rare</option>
                    <option value="unique">Unique</option>
                </select>
                <label for="pre">Weather</label>
                <select id="pre" name="weather">
                    <option value="rain">Rain</option>
                    <option value="snow">Snow</option>
                    <option value="none">None</option>
                </select>
            </fieldset>
            <button id="c-btn" type="submit">Find Building Materials</button>
        </form>
        <form id="b-form" class="biomes-form">
        </form>

        // added this section to let users know of any changes that may have happened
        <section id="results" aria-live="polite"></section>
    </main>
    <footer>
        <h2>
            Nav Links
        </h2>
        <nav>
            <ul>
                <li>
                    <a href="index.html" id="home-pg-lnk">Home Page</a>
                </li>
                <li>
                    <a href="about.html" id="about-pg-lnk">About</a>
                </li>
                <li>
                    <a href="bookmarks.html" id="bookmrk-pg-lnk">Bookmarks</a>
                </li>
            </ul>
        </nav>
        <p><a href="https://api.astroworldmc.com" target="_blank" rel="noopener">
            Powered by the AstroworldMC API
        </a></p>
    </footer>
</body>
</html>
